name: dayz-promo
version: '3.8'

services:
  backend:
    build:
      context: ./CrazyDayZ.Promo
      dockerfile: Dockerfile
    container_name: dayz-backend
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - BaseUrl=https://dayz-promo.ru
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8080"
    networks:
      - app-network
    restart: always
    depends_on:
      promocodes.database:
        condition: service_healthy
    volumes:
      - ./CrazyDayZ.Promo/wwwroot:/app/wwwroot
    user: "0:0"

  frontend:
    build:
      context: ./DayZPromo
      dockerfile: Dockerfile
    container_name: dayz-frontend
    environment:
      - NODE_ENV=production
      - VITE_API_URL=/api
      - VITE_BASE_URL=https://dayz-promo.ru
    expose:
      - "3000"
    networks:
      - app-network
    restart: always
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: dayz-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
      - ./CrazyDayZ.Promo/wwwroot:/app/wwwroot:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend
    networks:
      - app-network
    restart: always

  promocodes.database:
    image: postgres:13-alpine
    container_name: promocodes.database
    environment:
      - POSTGRES_DB=promocodes
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - PGDATA=/var/lib/postgresql/data
      - POSTGRES_INITDB_ARGS=--wal-segsize=1
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    expose:
      - "5432"
    networks:
      - app-network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
    user: root
    command: bash -c "chown -R postgres:postgres /var/lib/postgresql/data && su postgres -c '/usr/local/bin/docker-entrypoint.sh postgres'"

networks:
  app-network:
    driver: bridge