name: dayz-promo
version: '3.8'

services:
  backend:
    build:
      context: ./CrazyDayZ.Promo
      dockerfile: Dockerfile
    container_name: dayz-backend
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - BaseUrl=https://dayz-promo.ru
      - ConnectionStrings__DefaultConnection=Host=promocodes.database;Port=5432;Database=promocodes;Username=postgres;Password=postgres;Include Error Detail=true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8080"
    networks:
      - app-network
    restart: always
    depends_on:
      promocodes.database:
        condition: service_healthy
    volumes:
      - ./CrazyDayZ.Promo/wwwroot:/app/wwwroot
    user: "0:0"

  frontend:
    build:
      context: ./DayZPromo
      dockerfile: Dockerfile
    container_name: dayz-frontend
    environment:
      - NODE_ENV=production
      - VITE_API_URL=/api
      - VITE_BASE_URL=https://dayz-promo.ru
    expose:
      - "3000"
    networks:
      - app-network
    restart: always
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: dayz-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
      - ./CrazyDayZ.Promo/wwwroot:/app/wwwroot:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend
    networks:
      - app-network
    restart: always

  promocodes.database:
    image: postgres:13-alpine
    container_name: promocodes.database
    environment:
      - POSTGRES_DB=promocodes
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - PGDATA=/var/lib/postgresql/data
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    expose:
      - "5432"
    networks:
      - app-network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d promocodes"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
    user: root
    command: >
      bash -c "
        mkdir -p /var/lib/postgresql/data &&
        chown -R postgres:postgres /var/lib/postgresql/data &&
        chmod 700 /var/lib/postgresql/data &&
        echo 'host all all 0.0.0.0/0 md5' >> /var/lib/postgresql/data/pg_hba.conf &&
        echo 'listen_addresses=\"*\"' >> /var/lib/postgresql/data/postgresql.conf &&
        su postgres -c '/usr/local/bin/docker-entrypoint.sh postgres'
      "

networks:
  app-network:
    driver: bridge